name: Build Windows Executable & Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Download Windows FFmpeg and FFprobe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegPath = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobePath = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegPath.FullName -Destination "bin\ffmpeg.exe"
          Copy-Item $ffprobePath.FullName -Destination "bin\ffprobe.exe"
          Get-ChildItem -Path bin

      - name: Package Windows Portable Release
        shell: pwsh
        run: |
          python scripts/build_windows_dist.py

      - name: Upload Windows Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (Test-Path "dist\Quran Video Studio.exe") {
            gh release upload ${{ github.ref_name }} "dist\Quran Video Studio.exe" "dist\QuranVideoStudio-v1.4.0-Windows-Portable.zip" --clobber
          }
