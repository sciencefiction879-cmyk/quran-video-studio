<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { background: #06080e; color: #fff; font-family: "Scheherazade New", serif; font-size: 80px; text-align: center; padding: 80px; direction: rtl; }
  .word { display: inline-block; padding: 4px 14px; margin: 0 4px; border-radius: 14px; transition: all 0.2s; color: #e2e8f0; }
  .active { color: #ffe600 !important; background: rgba(212, 175, 55, 0.25); border: 2px solid rgba(255, 230, 0, 0.6); text-shadow: 0 0 35px rgba(255, 230, 0, 0.9); }
</style>
</head>
<body>
  <span class="word active">بِسْمِ</span>
  <span class="word">ٱللَّهِ</span>
  <span class="word">ٱلرَّحْمَـٰنِ</span>
  <span class="word">ٱلرَّحِيمِ</span>
</body>
</html>
