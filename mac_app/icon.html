<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 1024px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .icon-container {
      width: 960px;
      height: 960px;
      border-radius: 220px;
      background: radial-gradient(circle at 35% 30%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      border: 8px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(212, 175, 55, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .inner-circle {
      position: absolute;
      width: 820px;
      height: 820px;
      border-radius: 50%;
      border: 3px dashed rgba(212, 175, 55, 0.35);
    }
    .gold-crest {
      font-size: 260px;
      color: #ffd700;
      text-shadow: 0 0 50px rgba(255, 215, 0, 0.8), 0 0 90px rgba(212, 175, 55, 0.5);
      margin-bottom: 20px;
    }
    .app-title {
      font-size: 78px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 4px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .app-sub {
      font-size: 40px;
      font-weight: 600;
      color: #ffd700;
      letter-spacing: 6px;
      margin-top: 10px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <div class="inner-circle"></div>
    <div class="gold-crest">📖</div>
    <div class="app-title">QURAN STUDIO</div>
    <div class="app-sub">PURE PEACE 1080P • 4K</div>
  </div>
</body>
</html>
